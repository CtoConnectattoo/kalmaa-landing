<!doctype html>
<!--
  Fuente de public/og.png (1200×630). Para regenerarla: npm run og
  (usa Chrome en modo headless; ver scripts/build-images.mjs).
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-weight: 800;
        src: url('../node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 500;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2');
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0e0e10;
        color: #fff;
        font-family: 'Inter', Arial, sans-serif;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
      }
      body::after {
        content: '';
        position: absolute;
        right: -140px;
        top: -140px;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(198, 244, 50, 0.22), rgba(198, 244, 50, 0) 70%);
      }
      .logo { display: flex; align-items: center; gap: 16px; }
      .logo span {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.05em;
      }
      h1 {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 800;
        font-size: 76px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        max-width: 1000px;
      }
      .lime { color: #c6f432; }
      .pink { color: #ff6fb5; }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 28px;
        color: #d4d4d8;
      }
      .pill {
        background: #c6f432;
        color: #0e0e10;
        padding: 14px 26px;
        border-radius: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg width="64" height="64" viewBox="0 0 112 112">
        <path d="M20 12h72a12 12 0 0 1 12 12v48a12 12 0 0 1-12 12H48l-24 20V84h-4A12 12 0 0 1 8 72V24a12 12 0 0 1 12-12z" fill="#C6F432" />
        <circle cx="40" cy="48" r="12" fill="none" stroke="#0E0E10" stroke-width="7" />
        <path d="M52 36v24" stroke="#0E0E10" stroke-width="7" stroke-linecap="round" />
        <circle cx="72" cy="48" r="12" fill="none" stroke="#0E0E10" stroke-width="7" />
        <path d="M84 36v24" stroke="#0E0E10" stroke-width="7" stroke-linecap="round" />
      </svg>
      <span>kalmaa</span>
    </div>
    <h1>Respuestas automáticas en Instagram con <span class="lime">ChatGPT</span> y <span class="pink">Claude</span></h1>
    <div class="foot">
      <span>kalmaa.io</span>
      <span class="pill">Plan gratis · Pro desde 9 €/mes</span>
    </div>
  </body>
</html>
