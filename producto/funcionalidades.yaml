      - Solo cuentas profesionales (empresa o creador).
      - Una cuenta de Instagram por cuenta de Kalmaa (varias cuentas = «Escríbenos», sin plan Agencia).
    desde: null
    pasos:
      - Crea tu cuenta de Kalmaa con un enlace a tu email o con Google (sin contraseña).
      - Pulsa «Conecta tu Instagram» e inicia sesión con Instagram.
      - Acepta los permisos de mensajes y comentarios.
    no_hace:
      - No pide tu contraseña de Instagram.
    claims:
      permitidos:
        - Integración oficial con Instagram.
        - Inicio de sesión oficial de Instagram, nunca pedimos tu contraseña.
        - Puedes quitar el acceso cuando quieras.
      prohibidos:
        - Meta Business Partner / Meta Tech Provider / partner oficial de Meta.
        - Recomendado o aprobado por Meta (más allá de la revisión de apps).
        - Tu cuenta nunca tendrá problemas.
    bloqueos:
      - Verificación del negocio en Meta.
      - Renombrar la app de Meta (ID 538437435537013) a Kalmaa.
      - Migrar al inicio de sesión unificado (hoy «heredado»).
    capturas: []

