# Catálogo de funcionalidades de Kalmaa · fuente única de verdad del producto
#
# De aquí salen la ficha de la KB (kalmaa/producto/funcionalidades.md), la skill de marca/producto,
# los textos de la landing y el agente SEO/GEO. Si algo no está aquí como `activa`, no se promete como disponible.
# Cómo mantenerlo: producto/README.md. Generar la ficha: python3 producto/generar_ficha.py
#
# PROVISIONAL: vive en kalmaa-landing porque la app no existe (kalmaa-app está vacío y el Brief dice que el MVP
# no se empieza sin confirmar). Cuando arranque el MVP, se mueve a kalmaa-app/producto/ y aquí se deja un enlace.

producto: Kalmaa
web: https://kalmaa.io
frase_entidad: Respuestas automáticas en Instagram con ChatGPT y Claude
actualizado: 2026-11-15
estado_producto: >-
  En validación. La landing y la lista de espera están publicadas; la app no existe. Ninguna funcionalidad está activa.
fuentes:
  - Brief del 9 nov 2026, secciones 2–4 (https://docs.google.com/document/d/1Y-YqwjUME3KRhJArKGgxQTK8hxcMI1syQbhSU_y0ELw/edit)
  - KB kalmaa/producto/README.md (MVP, orden posterior, reglas de Instagram, qué NO hacer)
  - KB kalmaa/producto/mvp.md y decisiones.md (motor de flujos, decisión del 15 nov 2026)
  - KB kalmaa/estrategia/posicionamiento.md (precios del 9 nov 2026)
  - Skill kalmaa-branding, sección 0b (claims y prohibidos)

# Valores permitidos
estados: [en-desarrollo, beta, activa, oculta, retirada]
estados_no_hace: [no-previsto, en-pausa]
tipos_captura: [real, diseño]

# Límites de Instagram que el producto debe respetar (aplican a todo)
reglas_instagram:
  - 1 respuesta privada por comentario, dentro de los 7 días siguientes al comentario.
  - Ventana de 24 h desde el último mensaje de la persona para responder por DM.
  - Máximo 750 respuestas privadas por hora.
  - No se puede escribir primero ni enviar mensajes masivos.
  - No hay webhook para escribir a quien empieza a seguirte (Follow to DM).
  - Solo cuentas profesionales (empresa o creador).

planes:
  gratis:
    precio: 0 €, sin tarjeta
    incluye: Hasta 2 automatizaciones activas, hasta 1.000 DMs/mes, conector ChatGPT/Claude, plantillas, paso a WhatsApp, «Hecho con Kalmaa» en el DM
  pro:
    precio: 12 €/mes · 9 €/mes en anual (108 €) · sin IVA
    incluye: Automatizaciones y DMs ilimitados (uso razonable), captura de email, exportar contactos, sin «Hecho con Kalmaa»
  prueba: 14 días de Pro al registrarse; después pasa a Gratis y se quedan activos los 2 flujos más usados (el usuario puede cambiar cuáles, con aviso antes)
  fundadores: 9 €/mes pagando mes a mes, primeras 100 cuentas que pasen a Pro, mientras sigan suscritas
  latam: Pro 8 USD/mes (6 USD/mes en anual); moneda local cuando lo permita Stripe
  no_anunciar: Pro + IA (~24 €) y Agencia (~59 €)

