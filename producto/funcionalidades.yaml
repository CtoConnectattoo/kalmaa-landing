  - id: flujos
    nombre: Flujos de varios pasos
    que_hace: Cada automatización es un flujo, un disparador y pasos (mensaje con botones, esperar respuesta o clic, condición, guardar dato o etiqueta, pausa y respuesta pública).
    estado: en-desarrollo
    fase: mvp
    planes: [gratis, pro]
    limites:
      - Máximo 10 pasos por flujo.
      - Disparadores del MVP, comentario con palabra clave, respuesta a historia y palabra clave en DM.
      - Condiciones por botón pulsado, por lo que responde (texto, email, opción) y por si te sigue (solo si la prueba en la API lo confirma; entonces entra en el MVP y en la plantilla de sorteo).
      - Pausas y esperas siempre dentro de la ventana de 24 h; si la persona no responde a tiempo, el flujo termina o sigue cuando vuelva a escribir.
      - Gratis, 2 automatizaciones activas y 1.000 DMs/mes; pedir email solo en Pro.
    desde: null
    pasos:
      - Parte de una plantilla o pídele el flujo a tu IA.
      - En el panel ves el flujo paso a paso (solo lectura en el MVP) y lo activas o pausas.
    no_hace:
      - No tiene editor visual de bloques ni lienzo para arrastrar.
      - No envía secuencias de varios días ni escribe primero.
    claims:
      permitidos:
